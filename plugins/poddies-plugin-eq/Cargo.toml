[package]
name = "poddies-plugin-eq"
version = "0.1.0"
edition = "2021"
description = "Five-band parametric EQ for Poddies, with its own window."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
poddies-plugin-sdk = { path = "../../crates/poddies-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
