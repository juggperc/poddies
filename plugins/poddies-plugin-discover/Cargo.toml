[package]
name = "poddies-plugin-discover"
version = "0.1.0"
edition = "2021"
description = "Discovery source for Poddies backed by the public iTunes Search API."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
poddies-plugin-sdk = { path = "../../crates/poddies-plugin-sdk" }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "native-tls",
    "gzip",
    "query",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
