[package]
name = "poddies-plugin-listening-clock"
version = "0.1.0"
edition = "2021"
description = "Listening-habits panel for Poddies."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
poddies-plugin-sdk = { path = "../../crates/poddies-plugin-sdk" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
