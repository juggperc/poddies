[package]
name = "poddies-plugin-compressor"
version = "0.1.0"
edition = "2021"
description = "A one-knob vintage compressor for Poddies, docked in the now-playing pane."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
poddies-plugin-sdk = { path = "../../crates/poddies-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
