[package]
name = "poddies-plugin-host"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Sandboxed plugin worker and the host-side plugin manager."

[dependencies]
poddies-core = { path = "../poddies-core" }
poddies-plugin-api = { path = "../poddies-plugin-api" }
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[bin]]
name = "poddies-plugin-worker"
path = "src/bin/poddies-plugin-worker.rs"
