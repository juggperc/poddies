[package]
name = "poddies-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
feed-rs = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "charset", "http2", "system-proxy", "deflate", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"
